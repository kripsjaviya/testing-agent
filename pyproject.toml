[project]
name = "bugfixer"
version = "0.1.0"
description = "Autonomous agent that diagnoses and fixes bugs in a repository with a failing pytest suite"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "anthropic>=0.40",
    "google-genai>=0.3",
    "python-dotenv>=1.0",
]

[project.scripts]
bugfixer = "bugfixer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bugfixer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
